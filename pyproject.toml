[project]
name = "alethix"
version = "0.1.0"
description = "Alethix（探赜）—— 基于 LangGraph + Qdrant + FastAPI 的智能阅读检索解答智能体"
requires-python = ">=3.11"

dependencies = [
  # Web 框架
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",

  # 配置与校验
  "pydantic>=2.6",
  "pydantic-settings>=2.2",

  # 数据库
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",

  # 向量库：客户端与服务端 minor 版本差不得超过 1，故与镜像 v1.12.x 对齐
  "qdrant-client>=1.12,<1.14",

  # LLM 与编排
  "langchain>=0.3",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "tiktoken>=0.7",

  # 文档解析
  "pymupdf>=1.24",
  "python-docx>=1.1",

  # 工具
  "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
