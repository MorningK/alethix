# =============================================================================
# Alethix（探赜）· 开发中间件环境
# =============================================================================
# 用途：拉起 Alethix（探赜）在开发阶段所需的全部外部依赖。
#
# 说明：
#   - 本文件只包含【中间件】，应用服务（FastAPI、Ingest Worker）运行在宿主机，
#     通过 localhost:<宿主端口> 连接容器，便于断点调试与热重载。
#   - 所有端口、账号、密码都从项目根目录的 .env 读取，首次使用请先：
#         cp .env.example .env
#     然后按需修改。.env 已被 .gitignore 忽略，不会进入版本库。
#
# 常用命令：
#     启动            docker compose up -d
#     查看状态        docker compose ps          # 可观察 healthy / starting
#     查看日志        docker compose logs -f qdrant
#     停止            docker compose stop
#     停止并清数据    docker compose down -v     # 会删除全部命名卷
#     启用本地向量化  docker compose --profile local-emb up -d
#
# 入口地址：
#     Qdrant REST      http://localhost:6333
#     Qdrant Dashboard http://localhost:6333/dashboard
#     Qdrant gRPC      localhost:6334
#     PostgreSQL       localhost:5432
#     Redis            localhost:6379
#     TEI（可选）      http://localhost:8080
# =============================================================================

name: alethix

services:

  # ---------------------------------------------------------------------------
  # Qdrant —— 向量库
  # ---------------------------------------------------------------------------
  # 存放文档切片向量、原文与过滤用元数据（user_id / doc_id / chunk_index）。
  # Collection 由应用层脚本 scripts/init_qdrant.py 创建，不在本文件定义。
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: alethix-qdrant
    restart: unless-stopped

    ports:
      # REST / HTTP 接口，同时提供 Dashboard 与 healthz / readyz
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      # gRPC 接口，qdrant-client 的推荐通道，性能优于 REST
      - "${QDRANT_GRPC_PORT:-6334}:6334"

    environment:
      # 仅在调试阶段打开，会显著增加日志量
      QDRANT__LOG_LEVEL: ${QDRANT_LOG_LEVEL:-INFO}
      # 本地开发不启用 API Key；如需启用，请同时设置应用侧的 QDRANT_API_KEY
      # 并取消下一行注释：
      # QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}

    volumes:
      - qdrant_storage:/qdrant/storage

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    networks:
      - net

  # ---------------------------------------------------------------------------
  # PostgreSQL —— 关系库（权威数据源）
  # ---------------------------------------------------------------------------
  # 存放 users / documents / chunks / sessions / messages /
  #      agent_runs / iterations / answers / citations
  # Qdrant 中的数据均由本库的 chunks 表派生，可随时重建。
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: alethix-postgres
    restart: unless-stopped

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    environment:
      # :? 语法表示变量缺失时直接报错退出，避免空密码导致容器反复重启却看不出原因
      POSTGRES_USER: ${POSTGRES_USER:-alethix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请复制 .env.example 为 .env 并设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-alethix}
      # 显式指定 UTF-8 与默认排序规则，避免不同平台初始化出不一致的 locale
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
      TZ: UTC
      PGTZ: UTC

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alethix} -d ${POSTGRES_DB:-alethix}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    networks:
      - net

  # ---------------------------------------------------------------------------
  # Redis —— 缓存与任务状态
  # ---------------------------------------------------------------------------
  # 存放：文档处理任务状态、Embedding 结果缓存、限流计数、幂等锁、SSE 事件缓冲。
  # Redis 不存唯一数据，丢失后可由 PostgreSQL 重建或安全过期。
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: alethix-redis
    restart: unless-stopped

    ports:
      - "${REDIS_PORT:-6379}:6379"

    # 开启 AOF，开发期重启容器不丢失任务状态与限流计数。
    # 如需限制内存，可追加：--maxmemory 512mb --maxmemory-policy allkeys-lru
    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

    networks:
      - net

  # ---------------------------------------------------------------------------
  # TEI —— 本地 Embedding 服务（可选，默认不启动）
  # ---------------------------------------------------------------------------
  # 用途：离线开发或节省 Embedding API 费用。
  # 启动方式（需显式指定 profile）：
  #     docker compose --profile local-emb up -d
  #
  # ⚠️ 维度冲突警告（务必阅读）：
  #    项目默认 Embedding 为 text-embedding-3-small，维度 1536；
  #    而 TEI 默认模型 BAAI/bge-m3 的 dense 向量维度为 1024。
  #    二者【禁止】写入同一个 Qdrant Collection，否则检索直接报错。
  #    启用 TEI 时必须同时满足：
  #      1. EMBEDDING_BASE_URL=http://localhost:8080/v1（只改这个，不要动 OPENAI_BASE_URL）
  #      2. EMBEDDING_MODEL=BAAI/bge-m3
  #      3. EMBEDDING_DIM=1024
  #      4. QDRANT_COLLECTION 换成另一个名字，例如 document_chunks_bgem3
  #    维度变更的迁移流程见 prd/04-data-model.md §6.3。
  #
  # ⚠️ TEI 只提供 /v1/embeddings，没有 /v1/chat/completions。
  #    切勿把 OPENAI_BASE_URL 或 LLM_BASE_URL 指向 TEI，否则大模型调用全部失败。
  #
  # 注意：TEI 容器内监听 80 端口（不是 8080），8080 只是宿主机映射端口。
  # ---------------------------------------------------------------------------
  tei:
    # 注意：CPU 镜像必须带 cpu- 前缀；不带前缀的 1.9 是 Ampere GPU 镜像，
    #       在无 GPU 的机器上会启动失败。若机器有 NVIDIA GPU 且已装
    #       NVIDIA Container Toolkit，可改用 ghcr.io/huggingface/text-embeddings-inference:1.9
    #       并取消下面 deploy 段的注释。
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    container_name: alethix-tei
    restart: unless-stopped

    # 未指定 --profile local-emb 时该服务不会被拉起
    profiles:
      - local-emb

    environment:
      MODEL_ID: ${TEI_MODEL_ID:-BAAI/bge-m3}
      # 仅影响 OpenAI 兼容端点中返回的模型名；留空时等于 MODEL_ID
      SERVED_MODEL_NAME: ${TEI_SERVED_MODEL_NAME:-}
      # 单批最大 token 数，内存不足时可下调
      MAX_BATCH_TOKENS: ${TEI_MAX_BATCH_TOKENS:-16384}
      # 可选：为 TEI 设置访问密钥，留空表示不鉴权
      API_KEY: ${TEI_API_KEY:-}

    # 有 NVIDIA GPU 时（镜像需换成不带 cpu- 前缀的 GPU 版）取消注释：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    ports:
      # 宿主 8080 → 容器 80
      - "${TEI_PORT:-8080}:80"

    volumes:
      # HuggingFace 模型缓存，避免每次重建容器都重新下载（bge-m3 约 2.2 GB）
      - tei_cache:/data

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

    networks:
      - net

# =============================================================================
# 命名卷 —— 数据持久化
# =============================================================================
# 使用 Docker 命名卷而非宿主机目录挂载：跨平台、无文件权限问题。
# 需要彻底重置环境时执行：docker compose down -v
# =============================================================================
volumes:
  qdrant_storage:
  postgres_data:
  redis_data:
  tei_cache:

# =============================================================================
# 网络 —— 独立 bridge，与宿主机其他容器隔离
# =============================================================================
networks:
  net:
    driver: bridge
