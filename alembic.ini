[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# DSN is read from app settings in migrations/env.py; left empty to keep secrets out of this file.
# NOTE: keep this file ASCII-only -- configparser reads it with the locale encoding (GBK on
# Windows), and any non-ASCII byte here breaks `alembic` on Chinese-locale machines.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
